[project]
name = "predmarket-pipeline"
version = "0.1.0"
description = "Growth and pricing analysis of prediction-market listings (Manifold public API)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "duckdb>=1.5",
    "statsmodels>=0.15",
    "matplotlib>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
