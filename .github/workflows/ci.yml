name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Runs on the saved API samples and the committed results.json. The data-quality tests
      # need the built warehouse (data/ is never committed), so they skip here by design.
      - name: Tests (pytest)
        run: pytest -q -rs
